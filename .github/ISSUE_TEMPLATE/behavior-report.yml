name: Skill behavior report
description: Report a wrong editorial decision, missed issue, or false positive
title: "[Behavior]: "
body:
  - type: markdown
    attributes:
      value: Please provide a minimal reproducible example without confidential or personal data.
  - type: input
    id: version
    attributes:
      label: Skill version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and reasoning setting
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Review context
      description: Include text type, audience, channel, address form, tone, locale, source availability, and constraints.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input text
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the decision, issue dimension, severity, or invariant that should differ.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed confidential, copyrighted, and personally identifying content.
          required: true
